                - listitem [ref=e91]: Analyze and optimize code for quality, efficiency, and performance, and provide feedback to peers during code reviews
                - listitem [ref=e92]: Set direction and goals for teams, lead major initiatives, provide technical guidance and mentorship to peers, and help onboard new team members
                - listitem [ref=e93]: Architect efficient and scalable systems that drive complex applications
                - listitem [ref=e94]: Identify and resolve performance and scalability issues, and drive large efforts to reduce technical debt
                - listitem [ref=e95]: Work on a variety of coding languages and technologies
                - listitem [ref=e96]: Establish ownership of components, features, or systems with expert end-to-end understanding
