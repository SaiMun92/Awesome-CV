          - generic [ref=e54]:
            - paragraph [ref=e55]: We are building the next generation of AI Agentic capabilities for one of our core enterprise products, evolving it from a productivity tool into an intelligent assistant that can understand context, take actions, and get work done autonomously on behalf of our users.
            - paragraph [ref=e56]: We are seeking experienced AI Engineers who are passionate about solving complex technical challenges, whether as a hands-on Individual Contributor or in a Team Lead capacity. As a senior member of the team, you will work as a close technical partner to our Product Manager, shaping the product direction from a technical feasibility standpoint while owning the architecture and delivery of our AI Agent products end to end.
        - generic [ref=e57]:
          - heading "Job Description" [level=3] [ref=e58]
          - list [ref=e61]:
            - listitem [ref=e62]: Lead the technical architecture and end-to-end development of AI Agentic products for a core enterprise platform, partnering closely with the Product Manager to shape product direction from a technical feasibility standpoint.
            - listitem [ref=e63]: Architect and build scalable agent frameworks (multi-step reasoning, tool/function calling, memory, orchestration across multiple LLMs and services) that power our product's copilot and automation features.
            - listitem [ref=e64]: Own the full lifecycle of AI features — technical design, model selection/fine-tuning, evaluation, production deployment, and monitoring — ensuring reliability, latency, and cost efficiency at scale.
            - listitem [ref=e65]: Mentor junior AI engineers, set best practices for prompt engineering, RAG pipelines, and agent evaluation, and help build reusable AI infrastructure for the broader team.
            - listitem [ref=e66]: Partner cross-functionally with product, design, backend/infra, and security teams to ensure AI features are robust, safe, and compliant with data governance requirements.
            - listitem [ref=e67]: Stay on top of the latest advances in LLMs and agentic AI, and proactively identify opportunities to apply new techniques to our product roadmap.
        - generic [ref=e68]:
          - heading "Requirements" [level=3] [ref=e69]
          - list [ref=e72]:
            - listitem [ref=e73]: Bachelor's degree or above in Computer Science, Artificial Intelligence, or a related field; a Master's degree is a plus.
            - listitem [ref=e74]: Minimum 5 years of software engineering experience, including at least 2 years of hands-on experience building AI/ML or LLM-powered systems in production.
            - listitem [ref=e75]: "Deep expertise in LLM application development: prompt engineering, RAG, agent frameworks (e.g. LangChain, LlamaIndex, AutoGen), tool/function calling, and multi-agent orchestration."
            - listitem [ref=e76]: Strong foundation in machine learning/deep learning, with practical experience in model fine-tuning, evaluation, and optimization (latency, cost, accuracy trade-offs).
            - listitem [ref=e77]: Proven track record of shipping AI-powered products end-to-end, from prototype to production, ideally in a B2B/enterprise or SaaS setting.
            - listitem [ref=e78]: Excellent system design skills, able to architect scalable, secure, and maintainable AI infrastructure.
            - listitem [ref=e79]: Fast learner with a strong self-driven mindset and a bias for action; comfortable navigating ambiguity and driving technical decisions independently.
            - listitem [ref=e80]: Strong communication and collaboration skills, able to partner closely with product managers and designers to translate business needs into technical solutions.
            - listitem [ref=e81]: Experience with enterprise SaaS, productivity platforms, or AI copilot products is a strong plus.
