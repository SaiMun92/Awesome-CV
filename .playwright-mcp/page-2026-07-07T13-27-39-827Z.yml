                - generic [ref=e399]: Google will be prioritizing applicants who have a current right to work in Singapore, and do not require Google's sponsorship of a visa.
              - heading "Minimum qualifications:" [level=3] [ref=e400]
              - list [ref=e401]:
                - listitem [ref=e402]: Bachelor’s degree or equivalent practical experience.
                - listitem [ref=e403]: 5 years of experience with software programming in Python or C++.
                - listitem [ref=e404]: 3 years of experience testing, maintaining, or launching software products, and 1 year of experience with software design and architecture.
                - listitem [ref=e405]: 3 years of experience in a core ML domain, including but not limited to generative AI, Natural Language Processing (NLP), computer vision, speech/audio, reinforcement learning, recommendation systems, or ML infrastructure.
                - listitem [ref=e406]: 3 years of experience with ML infrastructure (e.g., model training, model inference, model deployment, model evaluation, optimization, data processing, debugging).
              - heading "Preferred qualifications:" [level=3] [ref=e407]
              - list [ref=e408]:
                - listitem [ref=e409]: Master's degree or PhD in Computer Science, or related technical fields.
                - listitem [ref=e410]: 5 years of experience with data structures and algorithms, with 2 years of experience in a technical leadership role, and ability to drive technical consensus and engineering excellence.
                - listitem [ref=e411]: Expertise in distributed systems architecture and core programming with nuanced LLM knowledge, and deploying and scaling enterprise-grade LLM backends, advanced RAG systems, and autonomous agentic workflows.
                - listitem [ref=e412]: Proficient in core ML concepts (attention, embeddings, encoders/decoders) and frameworks (PyTorch, JAX, TensorFlow) with experience optimizing ML models.
                - listitem [ref=e413]: Knowledge in AI safety, enterprise security, advanced prompt engineering, and scalable model evaluation methodologies.
            - generic [ref=e414]:
              - heading "About the job" [level=3] [ref=e415]
              - text: Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google’s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.
              - text: With your technical expertise you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.
              - text: As a Senior Software Engineer in the Acceleration Platform team in Singapore, you will architect the next generation of AI-native agentic systems designed to eliminate systemic developer toil at a global scale. You will own the technical goal, moving beyond tool-building to define the very paradigms of how autonomous AI resolves complex engineering challenges. You will navigate high-ambiguity, zero-to-one initiatives, establishing the gold standard for AI engineering excellence and security-by-design while scaling the technical capabilities of the entire organization through high-leverage mentorship.The Core team builds the technical foundation behind Google’s flagship products. We are owners and advocates for the underlying design elements, developer platforms, product components, and infrastructure at Google. These are the essential building blocks for excellent, safe, and coherent experiences for our users and drive the pace of innovation for every developer. We look across Google’s products to build central solutions, break down technical barriers and strengthen existing systems. As the Core team, we have a mandate and a unique opportunity to impact important technical decisions across the company.
            - generic [ref=e416]:
              - heading "Responsibilities" [level=3] [ref=e417]
              - list [ref=e418]:
                - listitem [ref=e419]: Lead the design and architecture of highly scalable, fault-tolerant systems where multi-agent networks reason, plan, and execute complex workflows across vast, distributed codebases.
                - listitem [ref=e420]: Define best practices for the team and broader organization. Blend traditional distributed systems architecture with advanced LLM orchestration, complex Retrieval Augmented Generation (RAG) pipelines, and optimization.
                - listitem [ref=e421]: Establish the overarching technical strategy for AI quality and safety. Build automated evaluation frameworks that measure performance, enforce strict security standards, and reliably mitigate at scale.
                - listitem [ref=e422]: Manage the most intricate non-deterministic edge cases. Build advanced telemetry and introspection tooling that allows the entire organization to understand, debug, and optimize self-sustaining behavior.
                - listitem [ref=e423]: Drive technical alignment across local pods and global organizations. Mentor junior and mid-level engineers, translate extreme ambiguity into actionable technical roadmaps, and shape the future of AI-driven developer productivity.
